server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API: the browser calls /api on this host, nginx forwards to the backend,
    # so the compose file works on a server without CORS or a baked-in API host.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls can take up to two model attempts of 20 s each.
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /catalog and /tasks/:id are client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
